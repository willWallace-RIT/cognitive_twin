<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognitive Twin Ingestion Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-mono">
    <div class="max-w-6xl mx-auto p-6">
        <header class="border-b border-slate-800 pb-6 mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-emerald-400">COGNITIVE TWIN // INGESTION PORTAL</h1>
                <p class="text-xs text-slate-400 mt-1">Multi-modal baseline dataset loader & auto-classifier</p>
            </div>
            <div class="space-x-3">
                <button onclick="exportDataset()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold rounded text-slate-955 transition">Export JSON</button>
                <button onclick="clearData()" class="px-4 py-2 bg-rose-900/50 hover:bg-rose-800 text-xs font-semibold rounded text-rose-200 transition">Reset State</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Ingestion Form -->
            <div class="bg-slate-900 border border-slate-800 p-5 rounded-lg shadow-xl">
                <h2 class="text-sm font-semibold text-emerald-300 uppercase tracking-wider mb-4">Ingest Payload</h2>
                <form id="ingestForm" onsubmit="handleIngest(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Raw Payload (JSON, Code snippet, or Text)</label>
                        <textarea id="payloadInput" rows="5" required class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500" placeholder='{"topic": "low-level memory", "completion_rate": 0.95}'></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Target Subclass</label>
                        <select id="subclassSelect" class="w-full bg-slate-950 border border-slate-800 rounded p-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                            <option value="auto">Auto-Classify (Heuristic)</option>
                            <option value="codebase">Codebase Subclass</option>
                            <option value="telemetry">Telemetry Subclass</option>
                            <option value="epistemic">Epistemic Subclass</option>
                            <option value="lexical">Lexical Subclass</option>
                            <option value="aesthetic">Aesthetic Subclass</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 text-xs font-semibold rounded transition border border-emerald-500/30">Classify & Ingest</button>
                </form>
            </div>

            <!-- Ingested Records Viewer -->
            <div class="md:col-span-2 bg-slate-900 border border-slate-800 p-5 rounded-lg shadow-xl flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-semibold text-emerald-300 uppercase tracking-wider">Baseline Dataset Registry</h2>
                    <div class="space-x-1 text-xs">
                        <button onclick="filterSubclass('all')" class="px-2 py-1 bg-slate-800 rounded text-slate-300 hover:bg-slate-700">All</button>
                        <button onclick="filterSubclass('codebase')" class="px-2 py-1 bg-slate-800 rounded text-slate-300 hover:bg-slate-700">Code</button>
                        <button onclick="filterSubclass('telemetry')" class="px-2 py-1 bg-slate-800 rounded text-slate-300 hover:bg-slate-700">Telemetry</button>
                        <button onclick="filterSubclass('epistemic')" class="px-2 py-1 bg-slate-800 rounded text-slate-300 hover:bg-slate-700">Epistemic</button>
                        <button onclick="filterSubclass('lexical')" class="px-2 py-1 bg-slate-800 rounded text-slate-300 hover:bg-slate-700">Lexical</button>
                    </div>
                </div>
                <div id="recordsList" class="space-y-2 overflow-y-auto max-h-[400px] pr-2 flex-grow">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let dataset = JSON.parse(localStorage.getItem('cognitive_twin_baseline') || '[]');

        function saveDataset() {
            localStorage.setItem('cognitive_twin_baseline', JSON.stringify(dataset));
            renderRecords();
        }

        function autoClassify(text) {
            const lower = text.toLowerCase();
            if (lower.includes('completion_rate') || lower.includes('topic') || lower.includes('watch')) return 'epistemic';
            if (lower.includes('risk_tolerance') || lower.includes('triage') || lower.includes('tempo')) return 'telemetry';
            if (lower.includes('ast') || lower.includes('paradigm') || lower.includes('modularity') || lower.includes('def') || lower.includes('class')) return 'codebase';
            if (lower.includes('vocab') || lower.includes('stylometric') || lower.includes('post')) return 'lexical';
            return 'aesthetic';
        }

        function handleIngest(e) {
            e.preventDefault();
            const raw = document.getElementById('payloadInput').value;
            let subclass = document.getElementById('subclassSelect').value;
            if (subclass === 'auto') subclass = autoClassify(raw);

            let parsed;
            try { parsed = JSON.parse(raw); } catch { parsed = { raw_text: raw }; }

            dataset.push({ id: Date.now(), subclass, data: parsed, timestamp: new Date().toISOString() });
            document.getElementById('payloadInput').value = '';
            saveDataset();
        }

        let currentFilter = 'all';
        function filterSubclass(sub) { currentFilter = sub; renderRecords(); }

        function renderRecords() {
            const container = document.getElementById('recordsList');
            container.innerHTML = '';
            const filtered = dataset.filter(r => currentFilter === 'all' || r.subclass === currentFilter);
            
            if (filtered.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-500 italic text-center py-8">No records ingested yet.</p>';
                return;
            }

            filtered.reverse().forEach(r => {
                const div = document.createElement('div');
                div.className = 'bg-slate-950 border border-slate-800/80 p-3 rounded text-xs flex justify-between items-start';
                div.innerHTML = `<div>
                    <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold uppercase bg-emerald-950 text-emerald-400 border border-emerald-800/50 mb-1">${r.subclass}</span>
                    <pre class="text-slate-300 font-mono text-[11px] mt-1 overflow-x-auto">${JSON.stringify(r.data, null, 2)}</pre>
                </div>
                <button onclick="deleteRecord(${r.id})" class="text-slate-600 hover:text-rose-400 font-bold ml-2">×</button>`;
                container.appendChild(div);
            });
        }

        function deleteRecord(id) {
            dataset = dataset.filter(r => r.id !== id);
            saveDataset();
        }

        function clearData() {
            if (confirm('Reset baseline dataset?')) {
                dataset = [];
                saveDataset();
            }
        }

        function exportDataset() {
            const blob = new Blob([JSON.stringify(dataset, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'cognitive_twin_baseline.json';
            a.click();
        }

        renderRecords();
    </script>
</body>
</html>
